name: Mirror Content

# 内容仓库 -> 站点仓库 的同步桥（2026-10-03 建立；同日因内容仓库转私有而补充凭据）
#
# 背景：原方案（内容仓库 workflow 用 DISPATCH_TOKEN 调站点仓库 repository_dispatch）已失效——
#   站点仓库自 2026-08-15 起 1249 次 run 中 repository_dispatch 记录为 0，内容仓库
#   每次 push 都在 dispatch 步红叉。改为站点仓库主动拉，读内容仓库用一个只读 PAT。
#
# 机制：每半小时比对内容仓库 master 的 HEAD sha；不一样就往站点仓库 main 推一个
#   chore(content-mirror) commit（commit message 里带上该 sha，同时写 content-sha.txt），
#   由 Vercel Git 自动部署线构建上线，prebuild 的 sync-content.js 会把最新内容拉进产物。
#
# 凭据（2026-10-03 内容仓库转私有后修订）：
#   - 读内容仓库：secrets.CONTENT_REPO_TOKEN，缺省回落到 secrets.DISPATCH_TOKEN
#     （同一个 PAT，权限 repo，能读该私有仓）；PAT 权限为 repo 时无需另建。
#   - 推自己仓库：自动注入的 GITHUB_TOKEN（actions/checkout + x-access-token 推送）。

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Compare content HEAD, push mirror commit if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CONTENT_REPO: yujing0208/yujingblog-content
          CONTENT_BRANCH: master
          # 读私有内容仓库用的 PAT，缺省回落到 DISPATCH_TOKEN
          CONTENT_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN || secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail

          echo "::group::获取内容仓库 HEAD"
          if [ -z "${CONTENT_TOKEN:-}" ]; then
            echo "::error::未配置 secrets.CONTENT_REPO_TOKEN（也没有 DISPATCH_TOKEN），无法读取私有内容仓库"
            echo "::error::新建方式：仓库 Settings → Secrets and variables → Actions → New repository secret"
            echo "::error::值填一个对该私有仓有 Contents: Read 权限的 GitHub PAT"
            exit 1
          fi
          # token 不写进 remote URL，只作为本次命令的 http header
          CONTENT_BASIC=$(printf 'x-access-token:%s' "$CONTENT_TOKEN" | base64 -w0)
          remote=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $CONTENT_BASIC" \
            ls-remote "https://github.com/$CONTENT_REPO.git" "refs/heads/$CONTENT_BRANCH" | cut -f1)
          if [ -z "$remote" ]; then
            echo "::error::git ls-remote 取不到内容仓库 HEAD。依次检查："
            echo "::error::  1) CONTENT_REPO_TOKEN 是否勾选了该私有仓的 Contents 读权限"
            echo "::error::  2) CONTENT_REPO=$CONTENT_REPO / CONTENT_BRANCH=$CONTENT_BRANCH 是否正确"
            echo "::error::  3) PAT 是否已过期"
            exit 1
          fi
          echo "内容仓库 HEAD = $remote"
          echo "::endgroup::"

          echo "::group::比对上次同步记录"
          last=$(git log -1 --grep="content-mirror" --format=%s origin/main | sed -n 's/.*content @\([0-9a-f]\{7,40\}\).*/\1/p' || true)
          echo "上次同步 = ${last:-未建立基线，本次为首次同步}"
          if [ -n "$last" ] && [ "$last" = "$remote" ]; then
            echo "内容未变化，跳过"
            exit 0
          fi
          echo "::endgroup::"

          echo "::group::推送 mirror commit"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --quiet -B mirror-tmp origin/main
          printf '%s\n' "$remote" > content-sha.txt
          git add content-sha.txt
          git commit -q -m "chore(content-mirror): sync content @$remote"
          git push --quiet "https://x-access-token:$GH_TOKEN@github.com/$REPO.git" HEAD:main
          echo "已推送 mirror commit，等待 Vercel 构建"
          echo "::endgroup::"
