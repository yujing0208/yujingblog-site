# 内容仓库 -> 站点仓库 的定时兜底同步桥
#
# 主链路：在线编辑器推送成功后会立刻调 /api/editor-sync 把内容仓库 HEAD 写进
# content-sha.txt 并推 mirror commit 到站点仓库 main（秒级上线）。
# 本 workflow 只是兜底：万一编辑器链路故障（Vercel 函数异常 / 登录过期 / 手动改了
# 内容仓库），这里每半小时补一次，保证内容最终一定会上线。
#
# 2026-10-04 修订（修「编辑器提示推送成功但线上永远不更新」）：
#   1. 比对依据从 `git log --grep=content-mirror`（会被用户自己的手动提交冲掉，
#      导致空推 mirror commit 刷构建）改为直接读 content-sha.txt；
#   2. 读不到内容仓库 HEAD 时改为 warning + 退出 0，不再留一排红叉掩盖真实故障；
#   3. **完全不用 actions/checkout 和 git**，改走 REST + curl：
#      - checkout 会往 .git/config 写 http.https://github.com/.extraheader，
#        再叠加我们自己的 extraheader 会触发
#        `remote: Duplicate header: "Authorization"` -> 400 -> exit 128（原来必红的根因）；
#      - gh CLI 不带自定义 token 时会用自己的 token 去读私有仓，拿到 404 当成功值用，
#        因此这里统一 curl + 显式 PAT，并对结果做 40 位 sha 校验；
#   4. **关闭 set -e**，每一步自己判断：原来 `set -e` + `set -o pipefail` 下，
#      jsha/jtree 里的 grep 取不到匹配就返回 1，整个 step 静默 exit 1，
#      日志里只剩一句 "Process completed with exit code 1"，完全看不出哪儿炸。
#      现在每步都打印原始返回，取不到就 ::error:: 明确指出是哪一步。
#
# 凭据：secrets.CONTENT_REPO_TOKEN（对该内容仓库有 Contents: Read 的 PAT），
#       缺省回落到 secrets.DISPATCH_TOKEN；都没有时跳过（主链路仍在）。
#
# 2026-10-05 修订（修「编辑器提交后 Vercel 部署显示成匿名」）：
#   Git Data API 建 commit 时若不带 author/committer，GITHUB_TOKEN 会让提交归属
#   github-actions[bot] —— Vercel 部署行上就是一个没头像的空圈。这里显式署名到
#   站长本人（env.GIT_AUTHOR_NAME / GIT_AUTHOR_EMAIL）。

name: Mirror Content

on:
  repository_dispatch:
    types: [content-updated]
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: content-mirror
  cancel-in-progress: false

env:
  API: https://api.github.com
  SITE_REPO: yujing0208/yujingblog-site
  CONTENT_REPO: yujing0208/yujingblog-content
  CONTENT_BRANCH: master
  SITE_BRANCH: main
  # mirror commit 的署名（不要用 GITHUB_TOKEN 的默认身份，否则 Vercel 显示匿名）
  GIT_AUTHOR_NAME: 余京
  GIT_AUTHOR_EMAIL: 2803673194@qq.com

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Compare content HEAD, push mirror commit if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTENT_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN || secrets.DISPATCH_TOKEN }}
        run: |
          set -uo pipefail

          # 发一次 GitHub API 请求；$1=token(可空) $2=method $3=path $4=body(可空)
          # -o /dev/null 不行，要 body；用 -w 额外把 HTTP 码打到 body 后面便于排查
          api() {
            local tok="$1" m="$2" p="$3" b="${4:-}"
            local args=(-sS --max-time 30 --retry 2 -X "$m" -H "Accept: application/vnd.github+json" -w "\n__HTTP__%{http_code}")
            if [ -n "$tok" ]; then args+=(-H "Authorization: Bearer $tok"); fi
            if [ -n "$b" ]; then args+=(-H "Content-Type: application/json" -d "$b"); fi
            curl "${args[@]}" "$API$p"
          }
          # 取第一个 40 位 sha。
          # 注意：GitHub REST 返回的是**无空格压缩 JSON**（{"object":{"sha":"..."}}），
          # key 与 value 之间可能根本没有空格，所以必须用 *（0 个或多个）而不是 +。
          # 末尾统一取 [0-9a-f]{40}，避免 grep 命中后带出来引号/尾巴。
          jsha() { grep -oE '"sha"[[:space:]]*:[[:space:]]*"[0-9a-f]{40}"' | head -1 | grep -oE '[0-9a-f]{40}'; }
          # 新建 blob / tree / commit / 更新分支 的响应都是 {...,"sha":"..."}，直接用 jq 取最稳，
          # jq 不在时（理论上 ubuntu runner 必装）回落到 jsha。
          js() { jq -r '.sha // empty' 2>/dev/null || true; }
          # 从 commit 响应里取 tree sha，**两种形态都要吃**：
          #   - GET /repos/{o}/{r}/commits/{sha}（commits API）里 tree 是字符串："tree":"78bf0f8a..."；
          #   - GET /repos/{o}/{r}/git/commits/{sha}（git API）里 tree 是对象： "tree":{"sha":"78bf0f8a..."}。
          # 只写对象形态会在 commits API  responses 上永远取空（曾导致 step 静默 exit 1）。
          jtree() {
            local v
            v=$(grep -oE '"tree"[[:space:]]*:[[:space:]]*"[0-9a-f]{40}"' | head -1 | grep -oE '[0-9a-f]{40}')
            if [ -z "$v" ]; then
              v=$(grep -oE '"tree"[[:space:]]*:[[:space:]]*\{[[:space:]]*"sha"[[:space:]]*:[[:space:]]*"[0-9a-f]{40}"' | head -1 | grep -oE '[0-9a-f]{40}')
            fi
            printf '%s' "$v"
          }
          # 判断是否取到值（不依赖退出码，供 set +e 后自己报错）
          is_sha() { printf '%s' "$1" | grep -Eq '^[0-9a-f]{40}$'; }

          echo "::group::读取内容仓库 HEAD"
          remote=""
          if [ -n "${CONTENT_TOKEN:-}" ]; then
            raw_remote=$(api "$CONTENT_TOKEN" GET "/repos/$CONTENT_REPO/git/ref/heads/$CONTENT_BRANCH")
            remote=$(printf '%s' "$raw_remote" | jsha)
            echo "内容仓库响应（前240字符）：$(printf '%s' "$raw_remote" | head -c 240)"
          fi
          if ! is_sha "$remote"; then
            echo "::warning::读不到内容仓库 HEAD（值='$remote'）：未配置 CONTENT_REPO_TOKEN，或 PAT 已失效。正常推送由 /api/editor-sync 主链路完成，本次定时兜底跳过。"
            exit 0
          fi
          echo "内容仓库 HEAD = $remote"
          echo "::endgroup::"

          echo "::group::比对站点仓库已记录的内容 sha"
          last=""
          raw=$(curl -sS --max-time 30 "https://raw.githubusercontent.com/$SITE_REPO/$SITE_BRANCH/content-sha.txt")
          if [ -n "$raw" ]; then last=$(printf '%s' "$raw" | tr -d '[:space:]'); fi
          echo "站点仓库 content-sha.txt = ${last:-（无记录）}"
          if [ -n "$last" ] && [ "$last" = "$remote" ]; then
            echo "内容已同步，跳过"
            exit 0
          fi
          echo "::endgroup::"

          echo "::group::推送 mirror commit"
          # 关掉 set -e：这里每一步都要自己判断并打印原始返回，
          # 否则 grep 取不到匹配（退出码 1）会直接把整个 step 带走，日志只剩一行 exit 1。
          set +e

          raw_ref=$(api "$GH_TOKEN" GET "/repos/$SITE_REPO/git/ref/heads/$SITE_BRANCH")
          parent=$(printf '%s' "$raw_ref" | jq -r '.object.sha // empty' 2>/dev/null)
          if [ -z "$parent" ]; then parent=$(printf '%s' "$raw_ref" | jsha); fi
          echo "① 站点 ref 响应（前240字符）：$(printf '%s' "$raw_ref" | head -c 240)"
          echo "① parent=[$parent]"
          if ! is_sha "$parent"; then echo "::error::第①步取站点 HEAD 失败"; exit 1; fi

          # commits API 里 commit.tree 是对象：{"sha":"038721fa...","url":"..."}
          # 用 jq 取 .commit.tree.sha；jq 不可用时用 grep 兜底（避开 \{ 在 ERE 里的转义歧义）
          raw_cm=$(api "$GH_TOKEN" GET "/repos/$SITE_REPO/commits/$parent")
          tree=$(printf '%s' "$raw_cm" | jq -r '.commit.tree.sha // empty' 2>/dev/null)
          if [ -z "$tree" ]; then
            tree=$(printf '%s' "$raw_cm" | grep -oE '"tree"[^,]*[,}]' | head -1 | grep -oE '[0-9a-f]{40}' | head -1)
          fi
          echo "② 站点 commit 响应（前240字符）：$(printf '%s' "$raw_cm" | head -c 240)"
          echo "② tree=[$tree]"
          if ! is_sha "$tree"; then echo "::error::第②步取站点 tree 失败"; exit 1; fi
          echo "站点 HEAD=$parent tree=$tree"

          blob=$(api "$GH_TOKEN" POST "/repos/$SITE_REPO/git/blobs" \
            '{"content":"'"$remote"'","encoding":"utf-8"}' | js)
          if [ -z "$blob" ]; then blob=$(printf '%s' "$blob" | jsha); fi
          if ! is_sha "$blob"; then echo "::error::第③步建 blob 失败"; exit 1; fi
          echo "③ blob=$blob"

          newtree=$(api "$GH_TOKEN" POST "/repos/$SITE_REPO/git/trees" \
            '{"base_tree":"'"$tree"'","tree":[{"path":"content-sha.txt","mode":"100644","type":"blob","sha":"'"$blob"'"}]}' | js)
          if [ -z "$newtree" ]; then newtree=$(printf '%s' "$newtree" | jsha); fi
          if ! is_sha "$newtree"; then echo "::error::第④步建 tree 失败"; exit 1; fi
          echo "④ tree=$newtree"

          # 显式署名：不带 author 时 GITHUB_TOKEN 会把提交算到 github-actions[bot] 名下，
          # Vercel 部署行就会显示成「匿名」（没有头像）。
          now_iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          commit=$(api "$GH_TOKEN" POST "/repos/$SITE_REPO/git/commits" \
            '{"message":"chore(content-mirror): sync content @'"$remote"'","tree":"'"$newtree"'","parents":["'"$parent"'"],"author":{"name":"'"$GIT_AUTHOR_NAME"'","email":"'"$GIT_AUTHOR_EMAIL"'","date":"'"$now_iso"'"},"committer":{"name":"'"$GIT_AUTHOR_NAME"'","email":"'"$GIT_AUTHOR_EMAIL"'","date":"'"$now_iso"'"}}' | js)
          if [ -z "$commit" ]; then commit=$(printf '%s' "$commit" | jsha); fi
          if ! is_sha "$commit"; then echo "::error::第⑤步建 commit 失败"; exit 1; fi
          echo "⑤ commit=$commit"

          upd=$(api "$GH_TOKEN" PATCH "/repos/$SITE_REPO/git/refs/heads/$SITE_BRANCH" '{"sha":"'"$commit"'"}')
          # 注意：PATCH /git/refs/... 的响应是 ref 对象，sha 在 .object.sha 里，
          # 顶层没有 "sha"（早期写成 .sha 会取空，明明推送成功了却被判失败）。
          upd_sha=$(printf '%s' "$upd" | jq -r '.object.sha // .sha // empty' 2>/dev/null)
          if [ -z "$upd_sha" ]; then upd_sha=$(printf '%s' "$upd" | jsha); fi
          if ! is_sha "$upd_sha"; then echo "::error::第⑥步更新分支失败，响应：$(printf '%s' "$upd" | head -c 240)"; exit 1; fi
          echo "⑥ 已推送 mirror commit $commit -> 分支已指向 $upd_sha，等待 Vercel 构建"
          echo "::endgroup::"
