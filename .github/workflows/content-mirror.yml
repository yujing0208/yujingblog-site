# 内容仓库 -> 站点仓库 的定时兜底同步桥
#
# 主链路：在线编辑器推送成功后会立刻调 /api/editor-sync 把内容仓库 HEAD 写进
# content-sha.txt 并推 mirror commit 到站点仓库 main（秒级上线）。
# 本 workflow 只是兜底：万一编辑器链路故障（Vercel 函数异常 / 登录过期 / 手动改了
# 内容仓库），这里每半小时补一次，保证内容最终一定会上线。
#
# 2026-10-04 修订（修「编辑器提示推送成功但线上永远不更新」）：
#   1. 比对依据从 `git log --grep=content-mirror`（会被用户自己的手动提交冲掉，
#      导致空推 mirror commit 刷构建）改为直接读 content-sha.txt；
#   2. 读不到内容仓库 HEAD 时改为 warning + 退出 0，不再留一排红叉掩盖真实故障；
#   3. 支持通过仓库 Secrets 注入专用 PAT（content-sha.txt 是分支上的真文件，
#      直接读工作区即可）。
#
# 凭据：secrets.CONTENT_REPO_TOKEN（对该私有内容仓库有 Contents: Read 的 PAT），
#       缺省回落到 secrets.DISPATCH_TOKEN；都没有时跳过（主链路仍在）。

name: Mirror Content

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: content-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Compare content HEAD, push mirror commit if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CONTENT_REPO: yujing0208/yujingblog-content
          CONTENT_BRANCH: master
          SITE_BRANCH: main
          # 读私有内容仓库用的 PAT，缺省回落到 DISPATCH_TOKEN
          CONTENT_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN || secrets.DISPATCH_TOKEN }}
        run: |
          set -uo pipefail

          echo "::group::读取内容仓库 HEAD"
          remote=""
          if [ -n "${CONTENT_TOKEN:-}" ]; then
            CONTENT_BASIC=$(printf 'x-access-token:%s' "$CONTENT_TOKEN" | base64 -w0)
            remote=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $CONTENT_BASIC" \
              ls-remote "https://github.com/$CONTENT_REPO.git" "refs/heads/$CONTENT_BRANCH" | cut -f1)
          fi
          if [ -z "$remote" ]; then
            echo "::warning::读不到内容仓库 HEAD：未配置 CONTENT_REPO_TOKEN，或 PAT 已失效。正常推送由 /api/editor-sync 主链路完成，本次定时兜底跳过。"
            exit 0
          fi
          echo "内容仓库 HEAD = $remote"
          echo "::endgroup::"

          echo "::group::比对站点仓库已记录的内容 sha"
          last=""
          if [ -f content-sha.txt ]; then last=$(tr -d '[:space:]' < content-sha.txt); fi
          echo "站点仓库 content-sha.txt = ${last:-（无记录）}"
          if [ -n "$last" ] && [ "$last" = "$remote" ]; then
            echo "内容未变化，跳过"
            exit 0
          fi
          echo "::endgroup::"

          echo "::group::推送 mirror commit"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --quiet -B mirror-tmp "origin/${SITE_BRANCH}"
          printf '%s\n' "$remote" > content-sha.txt
          git add content-sha.txt
          git commit -q -m "chore(content-mirror): sync content @$remote"
          git push --quiet "https://x-access-token:$GH_TOKEN@github.com/$REPO.git" "HEAD:${SITE_BRANCH}"
          echo "已推送 mirror commit，等待 Vercel 构建"
          echo "::endgroup::"
