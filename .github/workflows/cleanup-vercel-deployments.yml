name: Cleanup Vercel Deployments

# 部署存储清理工具（可反复手动跑）：
#   - 遍历 Vercel 账户下所有项目，删除旧部署释放 Deployment Storage（免费额度 10GB）
#   - 保留：当前生产部署（最新 READY 且 target=production）+ 最近 N 个部署（默认 4）
#   - 结果输出到：Job 日志、GITHUB_STEP_SUMMARY、commit status（匿名可读，便于核验）
#   - 本版新增诊断：读取 Vercel 真实用量端点 + 逐个探测 build-cache 端点（失败原因会原样打印）
# ⚠️ 删除不可恢复：被删部署的预览 URL 会失效（不影响线上正式站点）

on:
  workflow_dispatch:
    inputs:
      keep_recent:
        description: '除当前生产部署外，额外保留最近 N 个部署'
        required: false
        default: '4'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-vercel-deployments.yml'

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old deployments via Vercel API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          KEEP_RECENT: ${{ github.event.inputs.keep_recent || '4' }}
          GH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > /tmp/cleanup.mjs <<'EOF'
          const TOKEN = process.env.VERCEL_TOKEN;
          const KEEP = parseInt(process.env.KEEP_RECENT || '4', 10);
          const base = 'https://api.vercel.com';
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const H = { Authorization: `Bearer ${TOKEN}`, 'User-Agent': 'vercel-cleanup' };

          async function api(path, opts = {}) {
            let lastErr = null;
            for (let i = 0; i < 4; i++) {
              const res = await fetch(base + path, { ...opts, headers: { ...H, ...(opts.headers || {}) } });
              if (res.ok) { try { return await res.json(); } catch { return {}; } }
              const body = await res.text();
              lastErr = `${opts.method || 'GET'} ${path} -> ${res.status}: ${body.slice(0, 160)}`;
              if (res.status === 429 || res.status >= 500) { await sleep(1500 * (i + 1)); continue; }
              throw new Error(lastErr);
            }
            throw new Error(lastErr);
          }

          // ---- 0. 用量诊断：Deployment Storage 到底还剩多少 ----
          const usageProbe = [];
          for (const p of ['/v1/usage', '/v1/billing/usage', '/v1/deployments/usage']) {
            try {
              const r = await fetch(base + p, { headers: H });
              const t = await r.text();
              usageProbe.push(`${p} -> ${r.status}: ${t.slice(0, 240)}`);
            } catch (e) { usageProbe.push(`${p} -> ERR ${String(e.message).slice(0, 80)}`); }
            await sleep(200);
          }
          console.log('=== USAGE PROBE ===');
          for (const u of usageProbe) console.log(u);
          // 用量结果写成 annotation（无需鉴权即可读取，便于外部核验）
          for (const u of usageProbe) console.log(`::notice title=vercel-usage::${u}`);

          // ---- 1. 枚举账户下所有项目 ----
          const projects = [];
          let cursor;
          do {
            const d = await api(`/v9/projects?limit=100${cursor ? `&until=${cursor}` : ''}`);
            projects.push(...(d.projects || []));
            cursor = d.pagination && d.pagination.next ? d.pagination.next : undefined;
          } while (cursor);

          console.log(`projects: ${projects.length} -> ${projects.map((p) => p.name).join(', ')}`);

          // ---- 1.5 构建缓存端点探测（Deployment Storage 不计入 build cache，此处只为查证失败原因）----
          const cacheProbe = [];
          for (const p of projects) {
            const attempts = [];
            for (const path of [`/v1/build-cache/${p.id}`, `/v1/build-cache/${p.name}`]) {
              try {
                const r = await fetch(base + path, { method: 'DELETE', headers: H });
                const t = await r.text();
                attempts.push(`${path} -> ${r.status}: ${t.slice(0, 110)}`);
                if (r.ok) break;
              } catch (e) { attempts.push(`${path} -> ERR ${String(e.message).slice(0, 70)}`); }
              await sleep(150);
            }
            cacheProbe.push(`- **${p.name}**: ${attempts.join(' ｜ ')}`);
          }
          console.log('=== BUILD CACHE PROBE ===');
          for (const c of cacheProbe) console.log(c);

          // ---- 2. 逐项目清理旧部署 ----
          const rows = [];
          for (const p of projects) {
            const deps = [];
            let cursor;
            do {
              const d = await api(`/v6/deployments?projectId=${p.id}&limit=100${cursor ? `&until=${cursor}` : ''}`);
              deps.push(...(d.deployments || []));
              cursor = d.pagination && d.pagination.next ? d.pagination.next : undefined;
            } while (cursor);

            if (deps.length === 0) { rows.push({ name: p.name, total: 0, kept: 0, deleted: 0, failed: 0, errors: [] }); continue; }

            deps.sort((a, b) => b.created - a.created);
            const keep = new Set();
            const prod = deps.find((d) => d.state === 'READY' && d.target === 'production');
            if (prod) keep.add(prod.uid);            // 当前线上版本，绝不删
            for (const d of deps.slice(0, KEEP)) keep.add(d.uid);  // 最近 N 个留作回滚/排查

            const toDelete = deps.filter((d) => !keep.has(d.uid));
            let ok = 0, fail = 0;
            const errors = [];
            for (const d of toDelete) {
              try {
                await api(`/v13/deployments/${d.uid}`, { method: 'DELETE' });
                ok++;
              } catch (e) {
                fail++;
                errors.push(`${d.uid.slice(0, 12)}(${d.state}): ${e.message.slice(0, 100)}`);
              }
              await sleep(120);
            }
            rows.push({ name: p.name, total: deps.length, kept: keep.size, deleted: ok, failed: fail, errors });
            console.log(`::notice title=vercel-cleanup::${p.name}: total=${deps.length}, kept=${keep.size}, deleted=${ok}, failed=${fail}`);
          }

          // ---- 3. 汇总输出 ----
          const sum = rows.reduce((a, r) => ({ deleted: a.deleted + r.deleted, failed: a.failed + r.failed, total: a.total + r.total }), { deleted: 0, failed: 0, total: 0 });
          const summaryMd = [
            '## Vercel 部署清理结果',
            '',
            '| 项目 | 部署总数 | 保留 | 已删除 | 删除失败 |',
            '|---|---|---|---|---|',
            ...rows.map((r) => `| ${r.name} | ${r.total} | ${r.kept} | ${r.deleted} | ${r.failed} |`),
            '',
            `**合计**: 删除 ${sum.deleted} 个，失败 ${sum.failed} 个（原总数 ${sum.total}）`,
            '',
            '### 用量诊断（Vercel API）',
            ...usageProbe.map((u) => `- \`${u}\``),
            '',
            '### 构建缓存端点探测（不计入 Deployment Storage，仅查证）',
            ...cacheProbe,
            '',
            ...rows.flatMap((r) => r.errors.length ? [`### ${r.name} 失败明细`, ...r.errors.map((e) => `- ${e}`)] : []),
          ].join('\n');
          const fs = await import('fs');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summaryMd);

          // ---- 4. 写 commit status（匿名可读）----
          const ghSha = process.env.GH_SHA;
          const [owner, repo] = (process.env.GH_REPO || '/').split('/');
          const desc = `deleted=${sum.deleted}, failed=${sum.failed}, total=${sum.total} | ${rows.map((r) => `${r.name}:${r.deleted}/${r.total}`).join(' ')}`.slice(0, 137);
          try {
            const st = await fetch(`https://api.github.com/repos/${owner}/${repo}/statuses/${ghSha}`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                'User-Agent': 'vercel-cleanup-workflow',
                'Content-Type': 'application/json',
                Accept: 'application/vnd.github+json',
              },
              body: JSON.stringify({ state: 'success', context: 'vercel-cleanup', description: desc }),
            });
            console.log(`commit status -> ${st.status}`);
          } catch (e) {
            console.log(`commit status failed: ${e.message}`);
          }

          console.log('=== CLEANUP SUMMARY ===');
          for (const r of rows) console.log(`${r.name}: total=${r.total}, kept=${r.kept}, deleted=${r.deleted}, failed=${r.failed}${r.errors.length ? '\n    ' + r.errors.slice(0, 5).join('\n    ') : ''}`);
          console.log('=== DONE ===');
          EOF
          node /tmp/cleanup.mjs
