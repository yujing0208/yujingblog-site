name: Deploy Site

# 站点部署主链路（唯一部署入口）
# 触发：push 到 main 分支（方案 A：统一在 main 开发与推送）；或内容仓库通过 repository_dispatch 触发（type: deploy-site）
# 职责：在 GitHub Actions 内构建，并用 Vercel Token 直接部署产物到 Vercel，
#       不再 curl 触发 Vercel 二次构建。
# ⚠️ 历史注记：Vercel 项目设置中「Git 自动部署」实际从未关闭，push 后 Vercel 自行构建并部署。
# 2026-09-29 部署线决策（Round 12）：接受双线并行——Package 步骤改跑 vercel build，
# 使 workflow 线产物与自动线完全同构（原生 404 fallback + 中文路径解码匹配 + api/ 函数），
# 谁后完成谁占生产 alias 从此无害。VERCEL_TOKEN 失效期间 workflow 止步于 Link & Deploy，
# 生产部署由自动线承接，不受影响。
# 需要 Secrets：
#   VERCEL_TOKEN     —— Vercel 账户 Token（https://vercel.com/account/tokens）
#   VERCEL_ORG_ID    —— 团队/账户 ID（Vercel 项目 Settings → General）
#   VERCEL_PROJECT_ID—— 项目 ID（Vercel 项目 Settings → General）
#   DISPATCH_TOKEN   —— 有站点仓库 workflow 触发权限的 GitHub PAT（供内容仓库 repository_dispatch 使用）
#
# 健壮性增强（2026-08-26）：
#   - 各步骤显式失败即中断；构建/部署失败会标记 workflow 失败（Actions 页面可见）
#   - 失败时若配置了 NOTIFY_URL 则发送 webhook 通知，便于排查
#   - 在构建前记录被同步的内容仓库 commit，便于事后核对"内容是否真的进来了"
#
# serverless 函数打包（2026-09-24 起 / 2026-09-29 更新）：
#   vercel build（Package 步骤）自动发现仓库根部的 api/ 目录并打包为 serverless 函数
#   （/api/chat、/api/editor-auth、/api/editor-github），新增函数无需改本文件。
#   旧 --prebuilt 手动打包时代需要显式拷贝，已随 Round 12 部署线决策废弃。

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [deploy-site]

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11

      - name: Configure pnpm store
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      # 构建：prebuild 钩子会先 sync-content 拉取内容仓库，随后 astro build + pagefind
      - name: Build (sync content + astro build + pagefind)
        id: build
        env:
          ENABLE_CONTENT_SYNC: true
          CONTENT_REPO_URL: https://github.com/yujing0208/yujingblog-content.git
        run: |
          echo "触发来源: ${{ github.event_name }} / ${{ github.event.action }}"
          echo "站点仓库 commit: ${{ github.sha }}"
          pnpm build

      # Package Vercel Build Output：改跑官方 vercel build（2026-09-29 Round 12 部署线决策）。
      # 旧「手动打包 + 手写 config.json routes」路线被终结（Round 4b-10 实证）：
      #   - config.json routes 恒先于文件系统/函数层执行，catch-all 必遮蔽全站（v2/v3 事故）；
      #   - Vercel Git 自动部署线跑 vercel build，产物原生含 404 fallback + 中文路径解码匹配
      #     + api/ 函数，是唯一被线上实证正确的产物形态；本步骤与其收敛，双线竞争无害化。
      # 修复记录（Round 12 当轮）：首版直接 npx vercel build 在 CI 失败（日志 403 无法取证，
      #   最可能为缺项目上下文），故先 vercel link 建立 .vercel 上下文再 build（与部署步同参，
      #   VERCEL_TOKEN 已由 run 771 部署成功验证复活）；functions/ 缺失时回退旧版手动打包兜底。
      - name: Package Vercel Build Output (vercel build)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          npx vercel link --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --project "$VERCEL_PROJECT_ID"
          npx vercel build
          test -f .vercel/output/config.json || { echo "::error::vercel build: config.json missing"; exit 1; }
          test -f .vercel/output/static/index.html || { echo "::error::vercel build: static/index.html missing"; exit 1; }
          # api/ 函数：vercel build 正常会自动打包；若 functions/ 缺失则回退旧版手动打包兜底
          if [ ! -d .vercel/output/functions ] || [ -z "$(ls -A .vercel/output/functions 2>/dev/null)" ]; then
            echo "functions/ missing or empty after vercel build - falling back to manual api/*.js packing"
            shopt -s nullglob
            packaged=0
            for f in api/*.js; do
              name="$(basename "$f" .js)"
              dir=".vercel/output/functions/api/${name}.func"
              mkdir -p "$dir"
              cp "$f" "$dir/index.js"
              printf '{"runtime":"nodejs22.x","handler":"index.js","launcherType":"Nodejs"}' > "$dir/.vc-config.json"
              echo "packed function: /api/${name}"
              packaged=$((packaged + 1))
            done
            if [ "$packaged" -eq 0 ]; then
              echo "::error::api/ 下没有匹配到任何 *.js 函数，构建产物会缺失 serverless 函数"
              exit 1
            fi
          else
            echo "functions/ packaged by vercel build:"
            find .vercel/output/functions -maxdepth 3 -name ".vc-config.json" | head -10
          fi
          # 防御：若 vercel build 内部只跑 astro build 而非 package.json build 脚本，
          # dist 会被重建、pagefind 搜索索引丢失 —— 检测缺失则补跑并注入产物。
          if [ ! -d .vercel/output/static/pagefind ] && [ -d dist ]; then
            npx pagefind --site dist
            rm -rf .vercel/output/static/pagefind
            cp -r dist/pagefind .vercel/output/static/pagefind
            echo "pagefind index patched into output/static"
          fi
          node -e "const c=JSON.parse(require('fs').readFileSync('.vercel/output/config.json','utf8'));console.log('config.json: routes='+((c.routes||[]).length)+' functions='+Object.keys(c.functions||{}).length)"

      # 用 Vercel CLI 直接部署已打包好的 .vercel/output（prebuilt），不再 curl 触发 Vercel 二次构建。
      - name: Link & Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          npx vercel link --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --project "$VERCEL_PROJECT_ID"
          npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --yes

      # 部署存储治理（2026-09-27）：
      #   Hobby 免费版「部署存储」上限 10 GB。Astro 每次构建重新生成 /_astro/* 哈希资源
      #   （单字体 TTF 约 3.8 MB），每次部署完整存一份、Vercel 不会自动回收 →
      #   曾累积到 11.34 GB 触发超限，导致所有新部署被拒绝（Builds 显示 [0ms]）。
      #   此处仅清理「本项目」旧部署，保留最近 5 次；失败不影响本次部署结果。
      #   ⚠️ 必须按项目名过滤：同一账号下还有 waline-vercel / yujing-3d-home 等其他项目，
      #      不加过滤会误删它们的部署。
      - name: Prune old deployments (keep latest 5, this project only)
        if: success()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -uo pipefail
          KEEP=5
          # ls 输出按时间倒序；先按项目名过滤出本项目部署，再跳过前 KEEP 条
          urls=$(npx vercel ls --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --yes 2>/dev/null \
            | grep -oE 'https://yujingblog-site-[a-z0-9]+-yujing\.vercel\.app' \
            | awk '!seen[$0]++' | tail -n +$((KEEP + 1)) || true)
          if [ -z "$urls" ]; then
            echo "本项目没有需要清理的旧部署（总数 <= $KEEP）"
            exit 0
          fi
          count=0
          for url in $urls; do
            echo "pruning: $url"
            # 删除失败（如已是当前线上/已被清理）不阻断流程
            if npx vercel remove "$url" --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/dev/null 2>&1; then
              count=$((count + 1))
            else
              echo "  skip (remove failed): $url"
            fi
          done
          echo "已清理 $count 个旧部署"

      - name: Success notify
        if: success()
        env:
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
        run: |
          set -euo pipefail
          if [ -n "$NOTIFY_URL" ]; then
            curl -sS -o /dev/null -X POST "$NOTIFY_URL" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"[博客部署成功] 站点已更新 (commit ${{ github.sha }})\"}" || true
          fi

      - name: Failure notify
        if: failure()
        env:
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
        run: |
          set -euo pipefail
          echo "::error::站点部署失败，请检查上方步骤日志"
          if [ -n "$NOTIFY_URL" ]; then
            curl -sS -o /dev/null -X POST "$NOTIFY_URL" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"[博客部署失败] 触发器=${{ github.event_name }} commit=${{ github.sha }}，请查看 Actions 日志\"}" || true
          fi
