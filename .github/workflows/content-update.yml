name: Deploy Site

# 站点部署主链路（唯一部署入口）
# 触发：push 到 main 分支（方案 A：统一在 main 开发与推送）；或内容仓库通过 repository_dispatch 触发（type: deploy-site）
# 职责：在 GitHub Actions 内构建，并用 Vercel Token 直接部署产物到 Vercel，
#       不再 curl 触发 Vercel 二次构建。
# ⚠️ 需配合在 Vercel 项目设置中「关闭 Git 自动部署」，否则 push 会部署两次。
# 需要 Secrets：
#   VERCEL_TOKEN     —— Vercel 账户 Token（https://vercel.com/account/tokens）
#   VERCEL_ORG_ID    —— 团队/账户 ID（Vercel 项目 Settings → General）
#   VERCEL_PROJECT_ID—— 项目 ID（Vercel 项目 Settings → General）
#   DISPATCH_TOKEN   —— 有站点仓库 workflow 触发权限的 GitHub PAT（供内容仓库 repository_dispatch 使用）
#
# 健壮性增强（2026-08-26）：
#   - 各步骤显式失败即中断；构建/部署失败会标记 workflow 失败（Actions 页面可见）
#   - 失败时若配置了 NOTIFY_URL 则发送 webhook 通知，便于排查
#   - 在构建前记录被同步的内容仓库 commit，便于事后核对"内容是否真的进来了"
#
# serverless 函数打包（2026-09-24）：
#   --prebuilt 模式不会自动发现仓库根部的 api/ 目录，必须显式拷进 .vercel/output/functions/。
#   原先只硬编码打包了 api/chat.js，导致新增的 /api/editor-auth、/api/editor-github
#   虽然推到了 main，构建产物里却没有它们，线上访问一律 404。
#   现改为通配扫描 api/*.js，以后新增函数无需再改本文件。

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [deploy-site]

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11

      - name: Configure pnpm store
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      # 构建：prebuild 钩子会先 sync-content 拉取内容仓库，随后 astro build + pagefind
      - name: Build (sync content + astro build + pagefind)
        id: build
        env:
          ENABLE_CONTENT_SYNC: true
          CONTENT_REPO_URL: https://github.com/yujing0208/yujingblog-content.git
        run: |
          echo "触发来源: ${{ github.event_name }} / ${{ github.event.action }}"
          echo "站点仓库 commit: ${{ github.sha }}"
          pnpm build

      # 把 Astro 静态产物 dist/ 转换成 Vercel Build Output 格式（--prebuilt 要求 .vercel/output），
      # 否则 vercel deploy --prebuilt 会因找不到 .vercel/output 直接退出码 1。
      - name: Package Vercel Build Output
        run: |
          set -euo pipefail
          rm -rf .vercel/output
          mkdir -p .vercel/output/static
          cp -r dist/. .vercel/output/static/
          printf '{"version":3}' > .vercel/output/config.json
          # 合并中文路径路由配置（encodeNonAsciiDistPaths integration 生成）：
          #   routes    —— 原始 percent-encoded 请求串字面匹配编码产物（edge 层不解码时命中）
          #   overrides —— 解码后的中文请求路径映射到编码产物文件（服务端解码匹配时兜底）
          # 注意：本 workflow 不跑 vercel build，vercel.json 的 rewrites 不会进入部署配置，
          #       中文路由必须显式写入 config.json（2026-09-27 实测教训）。
          if [ -f .vercel/output/static/__fp-routes.json ]; then
            node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('.vercel/output/config.json','utf8'));const x=JSON.parse(fs.readFileSync('.vercel/output/static/__fp-routes.json','utf8'));c.routes=x.routes||[];c.overrides=x.overrides||{};fs.writeFileSync('.vercel/output/config.json',JSON.stringify(c));console.log('config.json: routes='+(c.routes.length)+' overrides='+Object.keys(c.overrides).length)"
            rm -f .vercel/output/static/__fp-routes.json
          else
            echo "no __fp-routes.json (no non-ASCII paths renamed)"
          fi
          # 打包 api/*.js 为 serverless 函数：
          #   /api/chat          —— DeepSeek 代理（看板娘聊天）
          #   /api/editor-auth   —— 编辑器密码登录（下发签名 Cookie）
          #   /api/editor-github —— 编辑器 GitHub 代理（服务端持有 GH_TOKEN）
          # 通配扫描而非逐个硬编码，新增 api/*.js 时无需再改本文件。
          shopt -s nullglob
          packaged=0
          for f in api/*.js; do
            name="$(basename "$f" .js)"
            dir=".vercel/output/functions/api/${name}.func"
            mkdir -p "$dir"
            cp "$f" "$dir/index.js"
            printf '{"runtime":"nodejs22.x","handler":"index.js","launcherType":"Nodejs"}' > "$dir/.vc-config.json"
            echo "packed function: /api/${name}"
            packaged=$((packaged + 1))
          done
          if [ "$packaged" -eq 0 ]; then
            echo "::error::api/ 下没有匹配到任何 *.js 函数，构建产物会缺失 serverless 函数"
            exit 1
          fi

      # 用 Vercel CLI 直接部署已打包好的 .vercel/output（prebuilt），不再 curl 触发 Vercel 二次构建。
      - name: Link & Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          npx vercel link --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --project "$VERCEL_PROJECT_ID"
          npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --yes

      # 部署存储治理（2026-09-27）：
      #   Hobby 免费版「部署存储」上限 10 GB。Astro 每次构建重新生成 /_astro/* 哈希资源
      #   （单字体 TTF 约 3.8 MB），每次部署完整存一份、Vercel 不会自动回收 →
      #   曾累积到 11.34 GB 触发超限，导致所有新部署被拒绝（Builds 显示 [0ms]）。
      #   此处仅清理「本项目」旧部署，保留最近 5 次；失败不影响本次部署结果。
      #   ⚠️ 必须按项目名过滤：同一账号下还有 waline-vercel / yujing-3d-home 等其他项目，
      #      不加过滤会误删它们的部署。
      - name: Prune old deployments (keep latest 5, this project only)
        if: success()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -uo pipefail
          KEEP=5
          # ls 输出按时间倒序；先按项目名过滤出本项目部署，再跳过前 KEEP 条
          urls=$(npx vercel ls --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --yes 2>/dev/null \
            | grep -oE 'https://yujingblog-site-[a-z0-9]+-yujing\.vercel\.app' \
            | awk '!seen[$0]++' | tail -n +$((KEEP + 1)) || true)
          if [ -z "$urls" ]; then
            echo "本项目没有需要清理的旧部署（总数 <= $KEEP）"
            exit 0
          fi
          count=0
          for url in $urls; do
            echo "pruning: $url"
            # 删除失败（如已是当前线上/已被清理）不阻断流程
            if npx vercel remove "$url" --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/dev/null 2>&1; then
              count=$((count + 1))
            else
              echo "  skip (remove failed): $url"
            fi
          done
          echo "已清理 $count 个旧部署"

      - name: Success notify
        if: success()
        env:
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
        run: |
          set -euo pipefail
          if [ -n "$NOTIFY_URL" ]; then
            curl -sS -o /dev/null -X POST "$NOTIFY_URL" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"[博客部署成功] 站点已更新 (commit ${{ github.sha }})\"}" || true
          fi

      - name: Failure notify
        if: failure()
        env:
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
        run: |
          set -euo pipefail
          echo "::error::站点部署失败，请检查上方步骤日志"
          if [ -n "$NOTIFY_URL" ]; then
            curl -sS -o /dev/null -X POST "$NOTIFY_URL" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"[博客部署失败] 触发器=${{ github.event_name }} commit=${{ github.sha }}，请查看 Actions 日志\"}" || true
          fi
