# =============================================================================
#  Pages CMS 配置文件
#  仓库：yujing0208/yujingblog-site
#  放置位置：仓库根目录，文件名必须是  .pages.yml
# =============================================================================
#
#  这个仓库是「站点外壳」——主题、导航、看板娘、评论系统、侧边栏布局等等。
#  文章和数据不在这里改（会被 sync-content.js 覆盖），去 yujingblog-content。
#
#  ⚠️ 重要：src/content/ 和 src/data/ 是 sync-content.js 从内容仓库同步过来的，
#     在这里改会被下次构建直接覆盖。所以本配置故意不暴露这两个目录。
#
#  Mizuki 主题的配置全是 TypeScript，PagesCMS 只能以代码编辑器方式打开。
#  好处是带语法高亮、保存即提交、手机上也能改；坏处是没有可视化表单。
#  改的时候注意别把 TS 语法写错，写错了构建会失败。
# =============================================================================


# -----------------------------------------------------------------------------
#  媒体库
# -----------------------------------------------------------------------------
media:
  - name: assets
    label: 站点素材（banner / 项目图等）
    input: public/assets
    output: /assets
    categories: [image]
    rename: false

  - name: favicon
    label: favicon / 头像
    input: public/favicon
    output: /favicon
    categories: [image]
    rename: false

  - name: public
    label: public 根目录
    input: public
    output: /
    rename: false


content:

  # ===========================================================================
  #  一、站点核心
  # ===========================================================================
  - name: core
    label: 站点核心
    type: group
    items:

      - name: cfg-site
        label: 站点主配置
        type: file
        path: src/config/siteConfig.ts
        format: code
        # 标题、副标题、语言、主题色、横幅 banner、字体、特色页面开关

      - name: cfg-profile
        label: 个人资料
        type: file
        path: src/config/profileConfig.ts
        format: code
        # 头像、昵称、简介、社交链接

      - name: cfg-navbar
        label: 导航栏
        type: file
        path: src/config/navBarConfig.ts
        format: code
        # 顶部菜单、多级下拉

      - name: cfg-footer
        label: 页脚
        type: file
        path: src/config/footerConfig.ts
        format: code
        # 页脚自定义 HTML（备案号写这里）

      - name: cfg-permalink
        label: 固定链接规则
        type: file
        path: src/config/permalinkConfig.ts
        format: code
        # URL 格式模板

      - name: cfg-index
        label: 配置导出入口
        type: file
        path: src/config/index.ts
        format: code
        # 新增配置文件时才需要动它


  # ===========================================================================
  #  二、外观与特效
  # ===========================================================================
  - name: appearance
    label: 外观与特效
    type: group
    items:

      - name: cfg-wallpaper
        label: 全屏壁纸
        type: file
        path: src/config/backgroundWallpaper.ts
        format: code
        # 图片源、轮播、透明度、模糊

      - name: cfg-sidebar
        label: 侧边栏布局
        type: file
        path: src/config/sidebarConfig.ts
        format: code
        # Widget 排序、动画、响应式断点。加了新组件忘了改这里 = 组件不显示

      - name: cfg-effects
        label: 樱花飘落特效
        type: file
        path: src/config/effectsConfig.ts
        format: code

      - name: cfg-pio
        label: Live2D 看板娘
        type: file
        path: src/config/pioConfig.ts
        format: code
        # 模型、AI 对话人设、位置

      - name: cfg-expressive-code
        label: 代码块样式
        type: file
        path: src/config/expressiveCodeConfig.ts
        format: code


  # ===========================================================================
  #  三、互动功能
  # ===========================================================================
  - name: interaction
    label: 互动功能
    type: group
    items:

      - name: cfg-comment
        label: 评论系统
        type: file
        path: src/config/commentConfig.ts
        format: code
        # Twikoo / Giscus

      - name: cfg-guestbook
        label: 留言板
        type: file
        path: src/config/guestbookConfig.ts
        format: code
        # QQ 群聊风格留言板

      - name: cfg-announcement
        label: 公告栏（开关与样式）
        type: file
        path: src/config/announcementConfig.ts
        format: code
        # 公告正文在内容仓库 data/announcement.ts

      - name: cfg-share
        label: 分享按钮
        type: file
        path: src/config/shareConfig.ts
        format: code


  # ===========================================================================
  #  四、多媒体
  # ===========================================================================
  - name: media-cfg
    label: 音乐播放器
    type: group
    items:

      - name: cfg-music
        label: 音乐播放器
        type: file
        path: src/config/musicConfig.ts
        format: code
        # 本地 / Meting 模式

      - name: cfg-firefly-music
        label: Firefly 歌单
        type: file
        path: src/config/fireflyMusic.ts
        format: code


  # ===========================================================================
  #  五、内容呈现
  # ===========================================================================
  - name: content-cfg
    label: 内容呈现
    type: group
    items:

      - name: cfg-license
        label: 文章许可协议
        type: file
        path: src/config/licenseConfig.ts
        format: code

      - name: cfg-related-posts
        label: 相关文章推荐
        type: file
        path: src/config/relatedPostsConfig.ts
        format: code

      - name: cfg-random-posts
        label: 随机文章推荐
        type: file
        path: src/config/randomPostsConfig.ts
        format: code

      - name: cfg-shuoshuo
        label: 说说页资料
        type: file
        path: src/config/shuoShuoProfile.ts
        format: code

      - name: cfg-changelog
        label: 更新日志
        type: file
        path: src/config/changelog.ts
        format: code


  # ===========================================================================
  #  六、部署与静态文件
  # ===========================================================================
  - name: deploy
    label: 部署与静态文件
    type: group
    items:

      - name: file-headers
        label: HTTP 响应头（_headers）
        type: file
        path: public/_headers
        format: code

      - name: file-astro-config
        label: Astro 构建配置
        type: file
        path: astro.config.mjs
        format: code
        # 改错了整站构建失败，动手前先想清楚

      - name: file-readme
        label: 仓库 README
        type: file
        path: README.md
        format: code


# -----------------------------------------------------------------------------
#  全局设置
# -----------------------------------------------------------------------------
settings:
  content:
    merge: true

  commit:
    identity: user
    templates:
      create: "chore(config): add {filename} (via Pages CMS)"
      update: "chore(config): update {filename} (via Pages CMS)"
      delete: "chore(config): remove {filename} (via Pages CMS)"
      rename: "chore(config): rename {oldFilename} -> {newFilename} (via Pages CMS)"
